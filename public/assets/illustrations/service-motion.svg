  </radialGradient>
  <radialGradient id="gOrb" cx="32%" cy="25%" r="72%">
    <stop offset="0" stop-color="#F3FFD4"/><stop offset="45%" stop-color="#D7FF70"/><stop offset="1" stop-color="#9ED12D"/>
